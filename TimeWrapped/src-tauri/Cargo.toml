[package]
name = "timewrapped"
version = "0.3.0"
description = "Local, event-driven activity tracking for Windows"
authors = ["TimeWrapped contributors"]
edition = "2021"
rust-version = "1.85"
default-run = "TimeWrapped"

[[bin]]
name = "TimeWrapped"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Power",
  "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Controls_Dialogs",
  "Win32_Security", "Win32_System_Environment", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

